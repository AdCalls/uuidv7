plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

group = 'com.adcalls'
version = '1.0.0'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {

    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api libs.commons.math3

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation libs.guava

    implementation("org.hibernate.orm:hibernate-core:7.1.8.Final")
    compileOnly("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")

    testCompileOnly("org.projectlombok:lombok:1.18.42")
    testAnnotationProcessor("org.projectlombok:lombok:1.18.42")
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

publishing {
    publications {
            mavenJava(MavenPublication) {
                from components.java

                groupId = project.group
                artifactId = 'uuidv7'
                version = project.version

                pom {
                    name = 'UUIDv7 Generator'
                    description = 'This library generates UUIDv7 from annotations.'
                    url = 'https://github.com/AdCalls/uuidv7'

                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/license/mit'
                        }
                    }

                    developers {
                        developer {
                            id = 'AdCalls'
                            name = 'AdCalls'
                            email = 'dev@adcalls.com'
                        }
                    }

                    scm {
                        connection = 'scm:git:git://github.com/AdCalls/uuidv7.git'
                        developerConnection = 'scm:git:ssh://github.com:AdCalls/uuidv7.git'
                        url = 'https://github.com/AdCalls/uuidv7'
                    }
                }
            }
        }

    repositories {
         maven {
             name = "OSSRH"
             url = uri(
                 version.endsWith("SNAPSHOT")
                     ? "https://s01.oss.sonatype.org/content/repositories/snapshots/"
                     : "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/"
             )

             credentials {
                 username = project.findProperty("ossrhUsername") ?: System.getenv("OSSRH_USERNAME")
                 password = project.findProperty("ossrhPassword") ?: System.getenv("OSSRH_PASSWORD")
             }
         }
     }
}

signing {
    def signingKey = project.findProperty("signing.keyId") ?: System.getenv("SIGNING_KEY_ID")
    def signingPassword = project.findProperty("signing.password") ?: System.getenv("SIGNING_PASSWORD")
    def signingSecretKey = project.findProperty("signing.secretKeyRingFile") ?: System.getenv("SIGNING_SECRET_KEY_RING_FILE")

    if (signingKey && signingPassword && signingSecretKey) {
        sign publishing.publications.mavenJava
    }
}
